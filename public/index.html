<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">

    <title>WebRTC Signaling Test</title>

    <link rel="stylesheet" href="session.css">

</head>
<body>

    <h1>WebRTC Signaling Test</h1>

    <div id="sessionIndicator"></div>

    <br>

    <input
    id="apiKey"
    type="password"
    placeholder="API Key">

    <br><br>

    <button id="createSession">
        Créer une session
    </button>

    <br><br>

    <input
    id="sessionId"
    type="text"
    placeholder="Code session">

    <button id="joinSession">
        Rejoindre une session
    </button>

    <hr>

    <div id="logs"></div>

    <script src="session.js"></script>

</body>
</html>
